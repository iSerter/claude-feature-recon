<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature Recon</title>
<style>
/* ============================================================================
   Tokens — dataviz reference palette.
   Two hue families carry meaning, and only two:
     blue = magnitude & structure (maturity ordinal ramp, density grids)
     red  = severity (ordinal ramp, critical furthest from the surface)
   Both ramps validated with the palette validator in --ordinal mode against
   both surfaces: monotone lightness, adjacent dL >= 0.06, light end >= 2:1.
   ============================================================================ */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f4f3ef;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --border-2: rgba(11,11,11,0.06);
  --wash: rgba(11,11,11,0.035);
  --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -12px rgba(11,11,11,0.10);
  --shadow-lift: 0 1px 2px rgba(11,11,11,0.05), 0 14px 34px -14px rgba(11,11,11,0.18);
  --glass: rgba(249,249,247,0.82);

  /* maturity — ordinal blue, light->dark = less->more ready */
  --mat-missing: #86b6ef;
  --mat-stub: #5598e7;
  --mat-alpha: #2a78d6;
  --mat-beta: #1c5cab;
  --mat-production_ready: #0d366b;
  /* blue sequential steps for density grids + meter tracks */
  --seq-0: #eef4fd;
  --seq-1: #cde2fb;
  --seq-2: #9ec5f4;
  --seq-3: #5598e7;
  --seq-4: #2a78d6;
  --seq-5: #184f95;
  --accent: #2a78d6;
  --accent-soft: rgba(42,120,214,0.10);

  /* severity — ordinal red */
  --sev-critical: #6b1616;
  --sev-high: #9c2626;
  --sev-medium: #cc4444;
  --sev-low: #e08585;

  /* finding kind (3 categorical slots; always paired with a text label) */
  --kind-bug: #9c2626;
  --kind-gap: #2a78d6;
  --kind-opp: #1baf7a;

  /* reserved status palette — fixed, never themed; always dot + label */
  --st-good: #0ca30c;
  --st-warning: #fab219;
  --st-critical: #d03b3b;
  --good-text: #006300;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #131312;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --border-2: rgba(255,255,255,0.06);
    --wash: rgba(255,255,255,0.04);
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 10px 30px -14px rgba(0,0,0,0.7);
    --shadow-lift: 0 1px 2px rgba(0,0,0,0.6), 0 18px 40px -16px rgba(0,0,0,0.85);
    --glass: rgba(13,13,13,0.80);
    --mat-missing: #184f95;
    --mat-stub: #256abf;
    --mat-alpha: #3987e5;
    --mat-beta: #6da7ec;
    --mat-production_ready: #9ec5f4;
    --seq-0: #12233a;
    --seq-1: #163256;
    --seq-2: #1c5cab;
    --seq-3: #2a78d6;
    --seq-4: #5598e7;
    --seq-5: #9ec5f4;
    --accent: #3987e5;
    --accent-soft: rgba(57,135,229,0.16);
    --sev-critical: #f09a95;
    --sev-high: #e06b66;
    --sev-medium: #c04440;
    --sev-low: #94302d;
    --kind-bug: #e06b66;
    --kind-gap: #3987e5;
    --kind-opp: #199e70;
    --good-text: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #131312;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835;
  --border: rgba(255,255,255,0.10); --border-2: rgba(255,255,255,0.06);
  --wash: rgba(255,255,255,0.04);
  --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 10px 30px -14px rgba(0,0,0,0.7);
  --shadow-lift: 0 1px 2px rgba(0,0,0,0.6), 0 18px 40px -16px rgba(0,0,0,0.85);
  --glass: rgba(13,13,13,0.80);
  --mat-missing: #184f95; --mat-stub: #256abf; --mat-alpha: #3987e5;
  --mat-beta: #6da7ec; --mat-production_ready: #9ec5f4;
  --seq-0: #12233a; --seq-1: #163256; --seq-2: #1c5cab; --seq-3: #2a78d6;
  --seq-4: #5598e7; --seq-5: #9ec5f4;
  --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16);
  --sev-critical: #f09a95; --sev-high: #e06b66; --sev-medium: #c04440; --sev-low: #94302d;
  --kind-bug: #e06b66; --kind-gap: #3987e5; --kind-opp: #199e70;
  --good-text: #0ca30c;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* The hero breaks out of .wrap to full-bleed; clip (not hidden) keeps that from ever
     producing a horizontal scrollbar without making the page a scroll container. */
  overflow-x: clip;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px 120px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.015em; }
p { margin: 0 0 12px; }
a { color: inherit; text-decoration: none; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-2); }
.faint { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--glass); backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border-2);
}
.topbar .inner {
  max-width: 1200px; margin: 0 auto; padding: 11px 28px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; }
.brand .glyph {
  width: 22px; height: 22px; border-radius: 6px; flex: none;
  background: linear-gradient(140deg, var(--accent), var(--mat-production_ready));
  display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700;
}
.brand .sep { color: var(--baseline); font-weight: 400; }
.brand .sub { color: var(--muted); font-weight: 500; }
nav.jump { margin-left: auto; display: flex; gap: 2px; }
nav.jump a {
  font-size: 13px; color: var(--ink-2); padding: 5px 10px; border-radius: 999px;
}
nav.jump a:hover { background: var(--wash); color: var(--ink); }
.iconbtn {
  font: inherit; font-size: 13px; cursor: pointer; width: 30px; height: 30px;
  display: grid; place-items: center; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
}
.iconbtn:hover { background: var(--wash); color: var(--ink); }
/* Read position, as a hairline under the topbar. Width is set from one passive scroll listener. */
.topbar .progress {
  position: absolute; left: 0; bottom: -1px; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--mat-production_ready));
  border-radius: 0 2px 2px 0; pointer-events: none;
}

/* ---------- cover ----------
   Full-bleed band: the one place in the report that spends ink on atmosphere. Everything below
   it stays flat and quiet, so the drama reads as a title sequence rather than as decoration
   competing with the data. */
.cover {
  position: relative; isolation: isolate;
  margin-inline: calc(50% - 50vw); padding-inline: max(28px, calc(50vw - 600px));
  padding-block: 62px 34px; margin-bottom: 8px;
  border-bottom: 1px solid var(--border-2);
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--page) 78%);
}
/* Two glows and a hairline mesh. Separate layers so print can drop them in one rule. */
.cover .bg {
  position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
}
.cover .bg::before {
  content: ""; position: absolute; inset: -30% -10% auto -10%; height: 150%;
  background:
    radial-gradient(46% 58% at 18% 8%, var(--accent-soft), transparent 68%),
    radial-gradient(38% 52% at 88% 2%, var(--accent-soft), transparent 70%),
    radial-gradient(30% 44% at 62% 96%, var(--accent-soft), transparent 72%);
}
.cover .bg::after {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 62px 62px;
  opacity: 0.4;
  mask-image: radial-gradient(72% 88% at 50% 0%, #000 0%, transparent 76%);
  -webkit-mask-image: radial-gradient(72% 88% at 50% 0%, #000 0%, transparent 76%);
}
.cover-grid { display: grid; grid-template-columns: 1fr auto; gap: 56px; align-items: center; }
.eyebrow {
  font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  display: inline-flex; align-items: center; gap: 10px;
}
.eyebrow::before {
  content: ""; width: 20px; height: 2px; border-radius: 2px; background: var(--accent);
}
.cover h1 {
  font-size: clamp(42px, 7.4vw, 82px); line-height: 0.98; letter-spacing: -0.042em;
  margin: 16px 0 0; font-weight: 660;
}
.cover .lede { margin-top: 18px; max-width: 58ch; font-size: 16.5px; color: var(--ink-2); }
.stampline {
  margin-top: 24px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
}
.stamp {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2);
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 4px 11px;
}
.stamp b { color: var(--ink); font-weight: 600; }

/* gauge */
.gauge { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.gauge::before {
  content: ""; position: absolute; top: -18px; left: 50%; width: 300px; height: 300px;
  transform: translateX(-50%); z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, var(--accent-soft), transparent 72%);
}
.gauge svg { display: block; }
.gauge .ring-track { stroke: var(--seq-1); }
.gauge .ring-beta { stroke: var(--mat-alpha); }
.gauge .ring-prod { stroke: var(--mat-production_ready); }
.gauge circle { fill: none; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.gauge .hero-fig {
  font-size: 50px; font-weight: 650; letter-spacing: -0.035em; line-height: 1;
}
.gauge .hero-cap { font-size: 12px; color: var(--muted); margin-top: 3px; }
.gauge .gl { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
.gauge .gl span { display: inline-flex; align-items: center; gap: 8px; }
.gauge .gl b { color: var(--ink); }

/* ---------- lens portraits ----------
   The renders are figures on pure white. A plate that stays light in BOTH themes, plus multiply,
   drops that white into the plate instead of punching a glaring box through a dark page. */
.plate {
  position: relative; overflow: hidden; border-radius: var(--r-sm);
  background: linear-gradient(165deg, #f6f8fb 0%, #e4e9f1 62%, #d8dfea 100%);
  aspect-ratio: 2 / 3; flex: none;
  /* Isolate, or multiply reaches past the plate and blends the figure into whatever surface is
     behind the card — which in dark mode turns the portrait into a grey smudge. */
  isolation: isolate;
}
.plate img {
  display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%;
  mix-blend-mode: multiply;
}
/* Without multiply the white simply reads as part of an already-light plate — still fine. */
@supports not (mix-blend-mode: multiply) { .plate img { mix-blend-mode: normal; } }
@media (forced-colors: active) { .plate img { mix-blend-mode: normal; } }
/* No portrait for this lens: a monogram, so the card keeps its shape. */
.plate .mono-fallback {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 600 30px/1 var(--sans); color: #7d8798; letter-spacing: -0.02em;
}

/* crew rail — the line-up along the bottom of the hero */
.crewrail {
  margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--border-2);
  display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: stretch;
}
.crewrail .rlead {
  font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  font-weight: 650; align-self: center; margin-right: 6px; max-width: 96px; line-height: 1.35;
}
a.crewchip {
  display: flex; align-items: center; gap: 11px; padding: 7px 14px 7px 7px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
  box-shadow: var(--shadow); transition: transform .16s ease, box-shadow .16s ease;
}
a.crewchip:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
/* At 36px a whole standing figure is an unreadable speck, so the chip zooms to the head. A
   background image is what makes that croppable to a fixed point without a wrapper per lens. */
a.crewchip .head {
  width: 36px; height: 36px; border-radius: 999px; flex: none;
  background-color: #eef1f6; background-repeat: no-repeat;
  background-size: 310%; background-position: 50% 5%; background-blend-mode: multiply;
}
a.crewchip .cn { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
a.crewchip .cc { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* crew gallery — portrait left, numbers right. The figure is a face on the card, not the card. */
.crew { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
.crewcard {
  display: flex; align-items: flex-start; gap: 14px; padding: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  box-shadow: var(--shadow);
  transition: transform .16s ease, box-shadow .16s ease;
}
.crewcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.crewcard .plate { width: 76px; aspect-ratio: 3 / 4; }
.crewcard .plate img { object-position: 50% 8%; }
.crewcard .plate .mono-fallback { font-size: 24px; }
.crewcard .cbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.crewcard .chead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.crewcard .crole { font-size: 14.5px; font-weight: 650; letter-spacing: -0.012em; }
/* The lens name, so the portrait is never a mystery photo. */
.crewcard .lens-label {
  font-size: 10.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); background: var(--wash); border-radius: 5px; padding: 2px 7px;
}
.crewcard .cblurb { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.crewcard .cstats {
  display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11.5px; color: var(--muted);
  font-variant-numeric: tabular-nums; margin-top: auto; padding-top: 1px;
}
.crewcard .cstats b { color: var(--ink); font-weight: 650; }

/* ---------- section scaffolding ---------- */
.sec { margin-top: 52px; scroll-margin-top: 80px; }
.sec > header.sh {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px;
  border-bottom: 1px solid var(--grid); padding-bottom: 9px;
}
/* A running index, so the report scans as a document rather than a pile of widgets. */
.sec > header.sh .ix {
  font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); border-radius: 5px; padding: 2px 6px;
  letter-spacing: 0.02em; align-self: center;
}
.sec > header.sh h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); font-weight: 650; white-space: nowrap;
}
.sec > header.sh .cap { font-size: 12.5px; color: var(--muted); margin-left: auto; text-align: right; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 22px 24px; box-shadow: var(--shadow);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* ---------- notice ---------- */
.notice {
  margin-top: 30px; padding: 15px 18px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface);
  border-left: 3px solid var(--accent);
  font-size: 13.5px; color: var(--ink-2); box-shadow: var(--shadow);
}
.notice b { color: var(--ink); }

/* ---------- stacked bars ---------- */
.stack { display: flex; border-radius: 0 5px 5px 0; }
.stack .seg {
  position: relative; min-width: 3px; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums;
  box-shadow: 2px 0 0 0 var(--surface);
  transform-origin: left center;
}
.stack .seg:last-child { box-shadow: none; border-radius: 0 5px 5px 0; }
.stack .seg.z { display: none; }
/* Segment label ink is declared per step, so a theme flip is pure CSS. */
.seg.m-missing { background: var(--mat-missing); color: #0b0b0b; }
.seg.m-stub { background: var(--mat-stub); color: #ffffff; }
.seg.m-alpha { background: var(--mat-alpha); color: #ffffff; }
.seg.m-beta { background: var(--mat-beta); color: #ffffff; }
.seg.m-production_ready { background: var(--mat-production_ready); color: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .seg.m-missing { color: #ffffff; }
  :root:where(:not([data-theme="light"])) .seg.m-production_ready { color: #0b0b0b; }
}
:root[data-theme="dark"] .seg.m-missing { color: #ffffff; }
:root[data-theme="dark"] .seg.m-production_ready { color: #0b0b0b; }

/* Flow state uses the reserved status palette — the one thing it is licensed for. Fixed in both
   themes, so the label ink is fixed with it. */
.seg.f-working { background: var(--st-good); color: #ffffff; }
.seg.f-partial { background: var(--st-warning); color: #0b0b0b; }
.seg.f-broken { background: var(--st-critical); color: #ffffff; }
.seg.f-not_implemented { background: var(--muted); color: #ffffff; }

.maturity-band .stack { height: 34px; }
.band .stack { height: 30px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 16px; font-size: 12.5px; color: var(--ink-2); }
.legend .key { display: inline-flex; align-items: center; gap: 8px; }
.legend .key.off { opacity: 0.45; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend .num { color: var(--ink); font-weight: 650; }

/* ---------- stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 16px; }
.tile {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 17px 18px 16px; box-shadow: var(--shadow);
  transition: transform .16s ease, box-shadow .16s ease;
}
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc, var(--baseline)); }
.tile .v { font-size: 38px; font-weight: 650; line-height: 1.05; letter-spacing: -0.035em; }
.tile .l { margin-top: 5px; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; font-weight: 500; }
.tile .sub { margin-top: 7px; font-size: 12px; color: var(--muted); line-height: 1.45; }
/* Share of the whole, under the count — a tile that reads 7 says nothing about 7 out of what. */
.tile .meter { margin-top: 11px; height: 4px; border-radius: 0 3px 3px 0; background: var(--wash); }
.tile .meter i { display: block; height: 100%; border-radius: 0 3px 3px 0; background: var(--seq-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* ---------- verdict ---------- */
.verdict { font-size: 15.5px; line-height: 1.72; color: var(--ink-2); max-width: 78ch; }
.verdict p:first-child::first-letter { font-size: 1em; }

/* ---------- bar rows ---------- */
.rows { display: flex; flex-direction: column; gap: 2px; }
.row {
  display: grid; grid-template-columns: 176px 1fr 38px; gap: 14px; align-items: center;
  padding: 5px 8px; border-radius: 7px; margin: 0 -8px;
}
.row:hover { background: var(--wash); }
.row .rlabel {
  font-size: 13px; text-align: right; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2);
}
.row:hover .rlabel { color: var(--ink); }
.row .track { height: 16px; background: var(--wash); border-radius: 0 5px 5px 0; }
.row .track .stack { height: 16px; }
.row .rval { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.axis-note { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ---------- risk map ----------
   maturity (x) x severity weight (y), area = findings. The one chart that answers "which feature
   should worry me", by putting immature-and-dangerous in a corner you cannot miss. */
.riskmap { width: 100%; height: auto; display: block; overflow: visible; }
.riskmap .axis { stroke: var(--grid); stroke-width: 1; }
.riskmap .axis-lab { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
.riskmap .quad { fill: var(--wash); }
.riskmap .quad-lab {
  fill: var(--muted); font-size: 10.5px; font-weight: 650;
  letter-spacing: 0.09em; text-transform: uppercase;
}
.riskmap .bub {
  fill: var(--accent); fill-opacity: 0.5;
  stroke: var(--surface); stroke-width: 2; cursor: pointer;
}
.riskmap .bub:hover { fill-opacity: 0.78; stroke: var(--ink); }
.riskmap .bub-lab { fill: var(--ink-2); font-size: 11px; font-weight: 600; pointer-events: none; }

/* ---------- heat grid ---------- */
.heat { display: grid; gap: 3px; font-size: 12px; }
.heat .hc {
  position: relative; aspect-ratio: 1 / 0.62; border-radius: 5px;
  display: grid; place-items: center; font-weight: 650;
  font-variant-numeric: tabular-nums; border: 1px solid var(--border-2);
}
.heat .hlab { display: grid; place-items: center; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
.heat .hlab.row-lab { justify-content: end; padding-right: 8px; }
.heat .d0 { background: var(--seq-0); color: var(--muted); }
.heat .d1 { background: var(--seq-1); color: #0b0b0b; }
.heat .d2 { background: var(--seq-2); color: #0b0b0b; }
.heat .d3 { background: var(--seq-3); color: #ffffff; }
.heat .d4 { background: var(--seq-4); color: #ffffff; }
.heat .d5 { background: var(--seq-5); color: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .heat .d1 { color: #ffffff; }
  :root:where(:not([data-theme="light"])) .heat .d2 { color: #ffffff; }
  :root:where(:not([data-theme="light"])) .heat .d4 { color: #0b0b0b; }
  :root:where(:not([data-theme="light"])) .heat .d5 { color: #0b0b0b; }
}
:root[data-theme="dark"] .heat .d1, :root[data-theme="dark"] .heat .d2 { color: #ffffff; }
:root[data-theme="dark"] .heat .d4, :root[data-theme="dark"] .heat .d5 { color: #0b0b0b; }

/* dependency matrix */
.dep { overflow-x: auto; }
.dep table { border-collapse: separate; border-spacing: 3px; }
.dep th {
  font-size: 10.5px; font-weight: 600; color: var(--muted); padding: 0;
  letter-spacing: 0.03em;
}
.dep th.col { vertical-align: bottom; }
/* vertical-rl keeps the label inside its own column box, so it stays aligned with the cells.
   No fixed height + nowrap: the header row sizes itself to the longest name instead of
   wrapping one label into two columns' worth of width. */
.dep th.col span {
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: inline-block; white-space: nowrap;
}
.dep th.rowh { text-align: right; padding-right: 8px; font-size: 11.5px; white-space: nowrap; }
.dep td { width: 16px; height: 16px; padding: 0; }
.dep td i { display: block; width: 16px; height: 16px; border-radius: 4px; background: var(--wash); }
.dep td i.on { background: var(--accent); }
.dep td i.self { background: transparent; border: 1px dashed var(--border); }

/* ---------- chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-2);
  white-space: nowrap;
}
.chip .sw { width: 8px; height: 8px; border-radius: 50%; }
.chip.plain { font-weight: 500; }
a.chip:hover { border-color: var(--accent); color: var(--ink); }
.pill {
  display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 10.5px;
  border: 1px solid var(--border); color: var(--muted); background: var(--surface-2);
  font-weight: 650; letter-spacing: 0.02em; text-transform: uppercase;
}
/* Which lens filed a finding: attribution, not a category — dashed so it reads as a source note
   and does not compete with the kind and severity chips beside it. */
.pill.lens { border-style: dashed; background: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* ---------- feature health grid ---------- */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 14px; }
/* flex-column, not block: a <button> vertically centres its content box, which would
   misalign cards of differing height inside the same grid row. */
.fcard {
  display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  text-align: left; width: 100%; font: inherit; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  padding: 15px 16px; box-shadow: var(--shadow);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.fcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); border-color: var(--baseline); }
.fcard .fh { display: flex; align-items: center; gap: 9px; }
.fcard .fn { font-weight: 650; font-size: 14.5px; letter-spacing: -0.01em; }
/* Maturity is named in text as well as coloured — the dot alone never carries it. */
.fcard .mat { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 650; }
.fcard .mdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.fcard .tests { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fcard .tests.none { color: var(--sev-high); font-weight: 650; }
.fcard .bar { display: flex; height: 7px; margin: 11px 0 11px; border-radius: 0 4px 4px 0; background: var(--wash); }
.fcard .matline { margin-top: 5px; }
.fcard .bar i { height: 100%; box-shadow: 2px 0 0 0 var(--surface); }
.fcard .bar i:last-child { box-shadow: none; border-radius: 0 4px 4px 0; }
.fcard .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.fcard .meta b { color: var(--ink-2); font-weight: 650; }

/* ---------- table ---------- */
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td { text-align: left; padding: 10px 11px; border-bottom: 1px solid var(--grid); }
table.data th {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); font-weight: 650; cursor: pointer; user-select: none; white-space: nowrap;
  position: sticky; top: 60px; background: var(--surface); z-index: 1;
}
table.data th.sorted { color: var(--ink); }
table.data th.sorted::after { content: " ↓"; }
table.data th.sorted.asc::after { content: " ↑"; }
table.data td.n, table.data th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover { background: var(--wash); }
.tbl-wrap { overflow-x: auto; }
.minibar { display: flex; height: 8px; width: 84px; border-radius: 0 3px 3px 0; }
.minibar i { height: 100%; box-shadow: 2px 0 0 0 var(--surface); }
.minibar i:last-child { box-shadow: none; border-radius: 0 3px 3px 0; }
details.plain > summary {
  list-style: none; cursor: pointer; font-size: 12.5px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 13px;
}
details.plain > summary::-webkit-details-marker { display: none; }
details.plain > summary::before { content: "▸"; color: var(--muted); font-size: 11px; }
details.plain[open] > summary::before { content: "▾"; }
details.plain > summary:hover { background: var(--wash); }
details.plain .card { margin-top: 14px; padding: 6px 10px; }

/* ---------- filters ---------- */
.filters {
  position: sticky; top: 53px; z-index: 20;
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
  background: var(--glass); backdrop-filter: saturate(180%) blur(14px);
  border: 1px solid var(--border); border-radius: var(--r);
  padding: 12px 15px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.filters label.f { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.filters select, .filters input[type=search] {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px;
}
.filters input[type=search] { min-width: 200px; }
.toggles { display: inline-flex; gap: 6px; }
.toggles button {
  font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  padding: 5px 12px; border-radius: 999px; color: var(--muted);
  border: 1px solid var(--border); background: var(--surface);
  display: inline-flex; align-items: center; gap: 7px;
}
.toggles button .sw { opacity: 0.35; }
.toggles button[aria-pressed="true"] { color: var(--ink); border-color: var(--baseline); background: var(--surface-2); }
.toggles button[aria-pressed="true"] .sw { opacity: 1; }
.btn {
  font: inherit; font-size: 12.5px; cursor: pointer; padding: 6px 12px;
  border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
}
.btn:hover { background: var(--wash); color: var(--ink); }
.fcount { margin-left: auto; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- feature drill-down ---------- */
details.feat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); margin-bottom: 12px; box-shadow: var(--shadow);
  scroll-margin-top: 130px;
}
details.feat[open] { border-color: var(--baseline); }
details.feat > summary {
  list-style: none; cursor: pointer; padding: 16px 20px;
  display: flex; align-items: center; gap: 13px; flex-wrap: wrap; border-radius: var(--r);
}
details.feat > summary::-webkit-details-marker { display: none; }
details.feat > summary::before {
  content: "▸"; color: var(--muted); font-size: 12px; flex: none; transition: transform .14s;
}
details.feat[open] > summary::before { transform: rotate(90deg); }
details.feat > summary:hover { background: var(--wash); }
.feat .fname { font-weight: 650; font-size: 15.5px; letter-spacing: -0.01em; }
.feat .counts { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feat .counts .fmatch:not(:empty) { color: var(--accent); font-weight: 650; }
.feat .body { padding: 6px 20px 22px; border-top: 1px solid var(--grid); }
.feat .body > .sub { margin-top: 20px; }
.sub > h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); margin-bottom: 9px; font-weight: 650;
}
.kv { display: grid; grid-template-columns: 132px 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--muted); font-size: 11.5px; padding-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
.kv dd { margin: 0; }
.paths { display: flex; flex-wrap: wrap; gap: 5px 6px; }
.paths code {
  background: var(--surface-2); border: 1px solid var(--border-2);
  border-radius: 5px; padding: 2px 6px; word-break: break-all; color: var(--ink-2);
}
ul.flows { list-style: none; margin: 0; padding: 0; }
ul.flows li { display: flex; gap: 12px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
ul.flows li:last-child { border-bottom: none; }
ul.flows .fbreak { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }

/* ---------- finding cards ---------- */
.find {
  border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--r-sm);
  padding: 13px 15px; margin-bottom: 9px; background: var(--surface);
}
.find.k-bug { border-left-color: var(--kind-bug); }
.find.k-bug.s-critical { border-left-color: var(--sev-critical); }
.find.k-bug.s-high { border-left-color: var(--sev-high); }
.find.k-bug.s-medium { border-left-color: var(--sev-medium); }
.find.k-bug.s-low { border-left-color: var(--sev-low); }
.find.k-gap { border-left-color: var(--kind-gap); }
.find.k-opp { border-left-color: var(--kind-opp); }
.find .fhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.find .ftitle { font-weight: 650; font-size: 14px; letter-spacing: -0.005em; }
.find .fid { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: auto; }
.find .fbody { margin-top: 9px; font-size: 13.5px; color: var(--ink-2); }
.find .fbody p { margin: 0 0 7px; }
.find .flabel {
  color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  font-weight: 650; margin-right: 3px;
}
.find .ev { margin-top: 10px; }

/* ---------- lists ---------- */
ol.seq { margin: 0; padding-left: 0; list-style: none; counter-reset: s; }
ol.seq li { counter-increment: s; display: flex; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
ol.seq li:last-child { border-bottom: none; }
ol.seq li::before {
  content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); border: 1px solid var(--border-2);
  display: grid; place-items: center; font-size: 11.5px; font-weight: 650; color: var(--accent);
}
ul.tops { margin: 0; padding: 0; list-style: none; }
ul.tops li { padding: 11px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; display: flex; gap: 11px; }
ul.tops li:last-child { border-bottom: none; }
ul.tops .ref {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: 5px; padding: 2px 6px; flex: none; align-self: flex-start;
}
.xc { margin-bottom: 12px; }
.xc .xhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.xc .xtitle { font-weight: 650; font-size: 14.5px; }

/* ---------- tooltip ---------- */
#tip {
  position: fixed; z-index: 60; pointer-events: none; opacity: 0;
  transition: opacity .12s; max-width: 270px;
  background: var(--ink); color: var(--page); font-size: 12px; line-height: 1.45;
  padding: 8px 10px; border-radius: 7px; box-shadow: 0 6px 20px rgba(0,0,0,0.22);
  font-weight: 500;
}
#tip.on { opacity: 1; }

footer {
  margin-top: 72px; padding-top: 22px; border-top: 1px solid var(--grid);
  font-size: 12px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap;
  align-items: center;
}
footer .credit { margin-left: auto; display: flex; align-items: center; gap: 8px; }
footer .credit .heart { color: #e0245e; font-style: normal; }
footer .credit b { color: var(--ink); font-weight: 650; }
footer .credit a {
  color: var(--accent); font-weight: 600;
  border-bottom: 1px solid transparent; transition: border-color .15s;
}
footer .credit a:hover { border-bottom-color: currentColor; }
footer .credit .sep { color: var(--grid); }
@media (max-width: 620px) {
  footer .credit { margin-left: 0; }
}

/* ---------- motion ---------- */
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
.stack .seg { animation: grow .55s cubic-bezier(.2,.7,.3,1) both; }
.tile, .fcard, .crewcard, a.crewchip { animation: fade .4s ease both; }
.gauge circle.anim { transition: stroke-dashoffset 1s cubic-bezier(.2,.7,.3,1); }
.riskmap .bub { animation: pop .5s cubic-bezier(.2,.7,.3,1) both; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .stack .seg, .tile, .fcard, .crewcard, a.crewchip, .riskmap .bub { animation: none; }
  .gauge circle.anim { transition: none; }
  .tile:hover, .fcard:hover, .crewcard:hover, a.crewchip:hover { transform: none; }
}

@media (max-width: 900px) {
  .cover-grid { grid-template-columns: 1fr; gap: 34px; }
  .cover .gauge { justify-self: start; }
  .grid2 { grid-template-columns: 1fr; }
  nav.jump { display: none; }
}
@media (max-width: 620px) {
  .wrap { padding: 0 16px 80px; }
  .cover { padding-inline: 16px; padding-block: 40px 26px; }
  .topbar .inner { padding: 10px 16px; }
  .row { grid-template-columns: 104px 1fr 30px; gap: 10px; }
  .kv { grid-template-columns: 1fr; }
  .find .fid { margin-left: 0; }
  .crew { grid-template-columns: 1fr; }
  .crewrail .rlead { max-width: none; width: 100%; margin-bottom: 2px; }
  .crewcard .plate { width: 62px; }
}
@media print {
  .topbar, .filters, .toggles, .iconbtn { display: none !important; }
  /* Atmosphere is for screens: a page of gradient wastes toner and greys the type. */
  .cover .bg { display: none; }
  .cover { background: none; margin-inline: 0; padding-inline: 0; }
  .card, .tile, .fcard, .crewcard, details.feat { box-shadow: none; }
  details.feat, .fcard, .tile, .crewcard, .riskmap { break-inside: avoid; }
  details.feat > .body { display: block !important; }
}
</style>
</head>
<body>
<script id="recon-data" type="application/json">{"project":null,"features":[]}</script>
<script id="recon-assets" type="application/json">{}</script>

<div class="topbar"><div class="inner" id="topbar"></div></div>
<div class="wrap" id="app"></div>
<div id="tip" role="tooltip"></div>

<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("recon-data").textContent || "{}");
  /* Lens portraits, inlined as data URIs by the build script. Their own island, so `Copy JSON`
     hands the reader the payload and not a quarter megabyte of base64. Empty when the build ran
     without the images — every use is guarded. */
  var ASSETS = JSON.parse(document.getElementById("recon-assets").textContent || "{}");
  var P = DATA.project || null;
  var FEATURES = DATA.features || [];
  var app = document.getElementById("app");
  var bar = document.getElementById("topbar");

  if (!P || !FEATURES.length) {
    app.innerHTML = '<div class="cover"><div class="eyebrow">Feature recon</div>' +
      "<h1>No data yet</h1><p class=\"lede\">Run <code>build_report.sh &lt;recon-dir&gt;</code> " +
      "to embed a sweep into this report.</p></div>";
    return;
  }

  var MATURITY = ["missing", "stub", "alpha", "beta", "production_ready"];
  var MAT_LABEL = { missing: "Missing", stub: "Stub", alpha: "Alpha", beta: "Beta",
                    production_ready: "Production ready" };
  var SEVERITY = ["critical", "high", "medium", "low"];
  var SEV_LABEL = { critical: "Critical", high: "High", medium: "Medium", low: "Low" };
  var FLOW_LABEL = { working: "Working", partial: "Partial", broken: "Broken",
                     not_implemented: "Not implemented" };
  var KIND_LABEL = { bug: "Bug", gap: "Gap", opp: "Opportunity" };
  var KIND_PLURAL = { bug: "Bugs", gap: "Gaps", opp: "Opportunities" };
  var EFFORT = ["S", "M", "L"];
  var EFFORT_LABEL = { S: "S · <1d", M: "M · 1-3d", L: "L · >3d" };
  var PRIORITY = ["P0", "P1", "P2", "P3"];
  var BUG_TYPE = ["runtime_error", "logic", "data_integrity", "security",
                  "performance", "ux", "a11y", "regression"];
  var TYPE_LABEL = { runtime_error: "Runtime error", logic: "Logic", data_integrity: "Data integrity",
                     security: "Security", performance: "Performance", ux: "UX", a11y: "Accessibility",
                     regression: "Regression" };
  var LENS_ORDER = ["product", "security", "ux", "e2e"];
  /* One row per lens: what it is called, who it is, and what it went looking for. The portrait is
     what carries lens identity in the UI — never a colour, which is spoken for by severity and
     magnitude. */
  var LENS_META = {
    product: { label: "Product", role: "Product Engineer",
               blurb: "Reads each feature end to end and owns its maturity rating." },
    security: { label: "Security", role: "Security Engineer",
                blurb: "Hunts authz gaps, unscoped queries and input nobody verified." },
    ux: { label: "UI/UX", role: "UI/UX Engineer",
          blurb: "Judges the screens a user actually meets — states, focus, labels." },
    e2e: { label: "Live browser", role: "QA Engineer",
           blurb: "The only lens that ran the app. Its findings were reproduced, not inferred." }
  };
  var LENS_LABEL = {};
  LENS_ORDER.forEach(function (l) { LENS_LABEL[l] = LENS_META[l].label; });
  var T = P.totals || {};

  /* Which review lenses actually contributed, in report order. A single-lens report shows no lens
     UI at all — a chip reading "Product" on every finding is noise when there is nothing to
     contrast it with. */
  var LENSES = (function () {
    var order = LENS_ORDER, seen = {}, out = [];
    FEATURES.forEach(function (f) {
      list(f.lenses).concat(f.lens ? [f.lens] : []).forEach(function (l) {
        if (l && !seen[l]) { seen[l] = 1; out.push(l); }
      });
    });
    return out.sort(function (a, b) {
      var x = order.indexOf(a), y = order.indexOf(b);
      return (x < 0 ? order.length : x) - (y < 0 ? order.length : y);
    });
  })();
  var MULTI_LENS = LENSES.length > 1;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }
  function list(x) { return Array.isArray(x) ? x : (x ? [x] : []); }
  function tip(text) { return ' data-tip="' + esc(text) + '"'; }
  function pct(n, d) { return d ? (n / d) * 100 : 0; }

  function paths(arr) {
    arr = list(arr);
    if (!arr.length) return '<span class="faint tiny">—</span>';
    return '<div class="paths">' + arr.map(function (p) {
      return "<code>" + esc(p) + "</code>";
    }).join("") + "</div>";
  }
  /* Density step for a heat cell: 0 stays near-surface, the rest span the ramp. */
  function densityClass(n, max) {
    if (!n) return "d0";
    return "d" + Math.max(1, Math.ceil((n / (max || 1)) * 5));
  }

  /* Head-and-shoulders crop of a lens portrait, for anywhere too small to read a whole figure. */
  function headshot(lens) {
    var meta = LENS_META[lens] || { label: lens, role: lens };
    return ASSETS[lens]
      ? '<span class="head" role="img" aria-label="' + esc(meta.role) +
        '" style="background-image:url(' + ASSETS[lens] + ')"></span>'
      : '<span class="head" aria-hidden="true"></span>';
  }

  /* A lens portrait on its plate, or a monogram when the build shipped without the images. */
  function portrait(lens, attrs, overlay) {
    var meta = LENS_META[lens] || { label: lens, role: lens };
    return '<div class="plate"' + (attrs || "") + ">" + (ASSETS[lens]
      ? '<img src="' + ASSETS[lens] + '" alt="' + esc(meta.role) + '" loading="lazy">'
      : '<span class="mono-fallback" aria-hidden="true">' +
        esc(meta.label.slice(0, 1).toUpperCase()) + "</span>") + (overlay || "") + "</div>";
  }

  /* Every finding in the report, flattened, each still carrying its kind and its lens. */
  function allFindings() {
    var out = [];
    FEATURES.forEach(function (f) {
      [["bug", "bugs"], ["gap", "gaps"], ["opp", "opportunities"]].forEach(function (k) {
        list(f[k[1]]).forEach(function (x) {
          out.push({ kind: k[0], lens: x.lens || "product", feature: f, x: x });
        });
      });
    });
    return out;
  }

  /* Severity weight: the same ranking `severityChart` sorts by, so the two charts never disagree
     about which feature is worst. */
  function severityWeight(bs) {
    return (bs.critical || 0) * 1000 + (bs.high || 0) * 100 +
           (bs.medium || 0) * 10 + (bs.low || 0);
  }

  /* ---------- topbar ---------- */
  /* Sections that actually rendered, so the nav never points at one that was skipped. section()
     appends as it goes, which is why the body is built before the topbar. */
  var NAV = [["overview", "Overview"]];

  function topbar() {
    return '<div class="brand"><span class="glyph">R</span>' +
        "<span>" + esc(P.project_name || "Project") + "</span>" +
        '<span class="sep">/</span><span class="sub">feature recon</span></div>' +
      '<nav class="jump">' +
        NAV.map(function (n) {
          return '<a href="#' + n[0] + '">' + esc(n[1]) + "</a>";
        }).join("") +
      "</nav>" +
      '<button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">◐</button>' +
      '<div class="progress" id="progress"></div>';
  }

  /* ---------- cover ---------- */
  function cover() {
    var by = T.by_maturity || {};
    var total = MATURITY.reduce(function (n, m) { return n + (by[m] || 0); }, 0) || 1;
    var ready = by.production_ready || 0;
    var betaPlus = ready + (by.beta || 0);
    var readyPct = Math.round(pct(ready, total));
    var betaPct = Math.round(pct(betaPlus, total));

    var R1 = 92, R2 = 68, C1 = 2 * Math.PI * R1, C2 = 2 * Math.PI * R2;
    var gauge =
      '<svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="' +
        betaPct + '% of features are beta or better; ' + readyPct + '% are production-ready">' +
        '<circle class="ring-track" cx="110" cy="110" r="' + R1 + '" stroke-width="15"></circle>' +
        '<circle class="ring-track" cx="110" cy="110" r="' + R2 + '" stroke-width="15"></circle>' +
        '<circle class="ring-beta anim" cx="110" cy="110" r="' + R1 + '" stroke-width="15"' +
          ' stroke-dasharray="' + C1.toFixed(1) + '" stroke-dashoffset="' + C1.toFixed(1) + '"' +
          ' data-off="' + (C1 * (1 - betaPlus / total)).toFixed(1) + '"></circle>' +
        '<circle class="ring-prod anim" cx="110" cy="110" r="' + R2 + '" stroke-width="15"' +
          ' stroke-dasharray="' + C2.toFixed(1) + '" stroke-dashoffset="' + C2.toFixed(1) + '"' +
          ' data-off="' + (C2 * (1 - ready / total)).toFixed(1) + '"></circle>' +
        '<text x="110" y="105" text-anchor="middle" class="hero-fig" fill="currentColor">' +
          readyPct + '%</text>' +
        '<text x="110" y="126" text-anchor="middle" class="hero-cap" fill="currentColor">' +
          "production-ready</text>" +
      "</svg>" +
      '<div class="gl">' +
        '<span><i class="sw" style="background:var(--mat-production_ready)"></i>' +
          "<b>" + ready + "</b> production-ready</span>" +
        '<span><i class="sw" style="background:var(--mat-alpha)"></i>' +
          "<b>" + betaPlus + "</b> beta or better</span>" +
        '<span><i class="sw" style="background:var(--seq-1)"></i>' +
          "<b>" + (total - betaPlus) + "</b> below beta</span>" +
      "</div>";

    var blind = FEATURES.reduce(function (n, f) {
      return n + list((f.coverage || {}).not_inspected).length;
    }, 0);

    /* The e2e lens ran the app, so "static read · no runtime" would be a lie on those reports. */
    var live = LENSES.indexOf("e2e") >= 0;

    return '<div class="cover" id="overview"><div class="bg" aria-hidden="true"></div>' +
      '<div class="cover-grid"><div>' +
        '<div class="eyebrow">Feature reconnaissance</div>' +
        "<h1>" + esc(P.project_name || "Untitled project") + "</h1>" +
        '<p class="lede">' + plural(T.features || FEATURES.length, "feature") + " swept, " +
          plural(T.bugs || 0, "bug") + ", " + plural(T.gaps || 0, "gap") + " and " +
          plural(T.opportunities || 0, "opportunity", "opportunities") +
          " recorded — every one of them citing the file and line it came from.</p>" +
        '<div class="stampline">' +
          (P.reviewed_at ? '<span class="stamp">Swept <b>' + esc(P.reviewed_at) + "</b></span>" : "") +
          (P.git_commit ? '<span class="stamp">Commit <b class="mono">' + esc(P.git_commit) +
            "</b></span>" : "") +
          '<span class="stamp">' + (live ? "Static read + live browser" : "Static read · no runtime") +
            "</span>" +
          (blind ? '<span class="stamp"><b>' + blind + "</b> areas not inspected</span>" : "") +
        "</div>" +
      '</div><div class="gauge">' + gauge + "</div></div>" +
      crewRail() +
      '<div class="notice"><b>This is reconnaissance, not ground truth.</b> ' +
        "Findings come from reading the code, not running it — so nothing here depends on a test " +
        "passing, and anything the sweep could not read is listed per feature under " +
        "<i>Not inspected</i>. " + (P.method ? esc(P.method) : "") + "</div>" +
      "</div>";
  }

  /* The line-up along the bottom of the hero: who reviewed this, and how much each one filed. */
  function crewRail() {
    var counts = findingsByLens();
    return '<div class="crewrail">' +
      '<div class="rlead">Reviewed by</div>' +
      LENSES.map(function (l, i) {
        var meta = LENS_META[l] || { label: l, role: l };
        var n = counts[l] ? counts[l].total : 0;
        return '<a class="crewchip" href="#crew" style="animation-delay:' + (i * 70) + 'ms"' +
          tip(meta.role + " — " + plural(n, "finding")) + ">" + headshot(l) +
          '<span><span class="cn">' + esc(meta.label) + '</span><br>' +
          '<span class="cc">' + plural(n, "finding") + "</span></span></a>";
      }).join("") + "</div>";
  }

  /* Findings grouped by the lens that filed them, with the severity split each one contributed. */
  function findingsByLens() {
    var by = {};
    allFindings().forEach(function (f) {
      var b = by[f.lens] || (by[f.lens] = { total: 0, bug: 0, gap: 0, opp: 0, sev: {},
                                            features: {} });
      b.total++;
      b[f.kind]++;
      b.features[f.feature.slug] = 1;
      if (f.kind === "bug") {
        var s = f.x.severity || "medium";
        b.sev[s] = (b.sev[s] || 0) + 1;
      }
    });
    return by;
  }

  /* Section index, so the report scans as a numbered document. Bumped by section() itself. */
  var secNo = 0;

  function section(id, title, cap, body, navLabel) {
    secNo++;
    if (navLabel) NAV.push([id, navLabel]);
    return '<section class="sec" id="' + id + '"><header class="sh">' +
      '<span class="ix">' + (secNo < 10 ? "0" : "") + secNo + "</span>" +
      "<h2>" + title + "</h2>" +
      (cap ? '<div class="cap">' + cap + "</div>" : "") + "</header>" + body + "</section>";
  }

  /* ---------- the review crew ----------
     Who read this codebase, and what each of them came back with. A single-lens sweep still gets
     its card — one portrait is a face on the report, not noise — but the contribution chart needs
     something to compare against, so it waits for a second lens. */
  function crew() {
    var by = findingsByLens();

    var cards = LENSES.map(function (l, i) {
      var meta = LENS_META[l] || { label: l, role: l, blurb: "" };
      var b = by[l] || { total: 0, bug: 0, gap: 0, opp: 0, sev: {}, features: {} };
      var seen = Object.keys(b.features).length;
      var sevBar = SEVERITY.map(function (s) {
        var n = b.sev[s] || 0;
        return n ? '<i style="width:' + pct(n, b.bug).toFixed(2) +
          "%;background:var(--sev-" + s + ')"></i>' : "";
      }).join("");
      return '<div class="crewcard" style="animation-delay:' + (i * 70) + 'ms">' +
        portrait(l, tip(meta.role + " — " + meta.blurb)) +
        '<div class="cbody">' +
          '<div class="chead"><span class="crole">' + esc(meta.role) + "</span>" +
            '<span class="lens-label">' + esc(meta.label) + "</span></div>" +
          '<div class="cblurb">' + esc(meta.blurb) + "</div>" +
          (b.bug ? '<div class="bar" style="height:6px;display:flex;border-radius:4px;' +
            'overflow:hidden;background:var(--wash)"' + tip(plural(b.bug, "bug") + " — " +
              SEVERITY.filter(function (s) { return b.sev[s]; }).map(function (s) {
                return b.sev[s] + " " + s;
              }).join(", ")) + ">" + sevBar + "</div>" : "") +
          '<div class="cstats">' +
            "<span><b>" + seen + "</b> " + (seen === 1 ? "feature" : "features") + "</span>" +
            "<span><b>" + b.bug + "</b> bugs</span>" +
            "<span><b>" + b.gap + "</b> gaps</span>" +
            "<span><b>" + b.opp + "</b> opps</span>" +
          "</div>" +
        "</div></div>";
    }).join("");

    var chart = "";
    if (MULTI_LENS) {
      var max = Math.max.apply(null, LENSES.map(function (l) {
        return by[l] ? by[l].total : 0;
      }).concat([1]));
      var rows = LENSES.map(function (l, i) {
        var b = by[l] || { total: 0, bug: 0, gap: 0, opp: 0 };
        var segs = ["bug", "gap", "opp"].map(function (k) {
          var n = b[k] || 0;
          if (!n) return "";
          return '<div class="seg" style="width:' + pct(n, b.total).toFixed(3) +
            "%;background:var(--kind-" + k + ");color:#fff;animation-delay:" + (i * 40) + 'ms"' +
            tip((LENS_META[l] || {}).label + " — " + plural(n, KIND_LABEL[k].toLowerCase())) +
            ">" + (pct(n, max) >= 7 ? n : "") + "</div>";
        }).join("");
        return '<div class="row"><div class="rlabel">' + esc((LENS_META[l] || {}).label || l) +
          '</div><div class="track"><div class="stack" style="width:' +
          pct(b.total, max).toFixed(3) + '%">' + segs + "</div></div>" +
          '<div class="rval">' + (b.total || "—") + "</div></div>";
      }).join("");
      var legend = ["bug", "gap", "opp"].map(function (k) {
        return '<span class="key"><i class="sw" style="background:var(--kind-' + k + ')"></i>' +
          KIND_PLURAL[k] + "</span>";
      }).join("");
      chart = '<div class="card" style="margin-top:18px">' +
        '<h3 style="font-size:14px;margin-bottom:14px">What each lens filed</h3>' +
        '<div class="rows">' + rows + "</div>" +
        '<div class="legend">' + legend + "</div>" +
        '<div class="axis-note">Bar length is total findings (longest ' + max +
        "). Lenses overlap by design — a defect the product lens missed and the security lens " +
        "caught is one finding, filed once, by whoever saw it. Duplicates were removed before " +
        "this report was built, so nothing here is double-counted.</div></div>";
    }

    return section("crew", "The review crew",
      plural(LENSES.length, "lens", "lenses") + " · " +
        plural(allFindings().length, "finding") + " filed",
      '<div class="crew">' + cards + "</div>" + chart, "Crew");
  }

  /* ---------- maturity band ---------- */
  function maturityBand() {
    var by = T.by_maturity || {};
    var total = MATURITY.reduce(function (n, m) { return n + (by[m] || 0); }, 0) || 1;
    var segs = MATURITY.map(function (m, i) {
      var n = by[m] || 0, p = pct(n, total);
      return '<div class="seg m-' + m + (n ? "" : " z") + '" style="width:' + p.toFixed(3) +
        "%;animation-delay:" + (i * 60) + 'ms"' +
        tip(MAT_LABEL[m] + " — " + plural(n, "feature") + " (" + Math.round(p) + "%)") +
        ">" + (p >= 9 ? n : "") + "</div>";
    }).join("");
    var legend = MATURITY.map(function (m) {
      return '<span class="key' + ((by[m] || 0) ? "" : " off") +
        '"><i class="sw" style="background:var(--mat-' + m + ')"></i>' + MAT_LABEL[m] +
        ' <span class="num">' + (by[m] || 0) + "</span></span>";
    }).join("");
    return section("maturity", "Maturity mix",
      "stub → production-ready, left to right",
      '<div class="card maturity-band"><div class="stack">' + segs + "</div>" +
      '<div class="legend">' + legend + "</div></div>");
  }

  /* ---------- stat tiles ---------- */
  function tiles() {
    var sev = T.bugs_by_severity || {};
    var noTests = list(T.features_without_tests);
    var lowConf = FEATURES.filter(function (f) { return f.confidence === "low"; });
    var broken = FEATURES.reduce(function (n, f) {
      return n + ((f.counts || {}).flows_broken || 0);
    }, 0);
    var nFeat = T.features || FEATURES.length || 1;
    var flows = FEATURES.reduce(function (n, f) { return n + list(f.user_flows).length; }, 0);
    /* Each tile's meter is a share of the population that tile counts against — bugs against all
       bugs, features against all features — named in `of` so the bar is never a bare mystery. */
    var items = [
      { v: sev.critical || 0, l: "Critical bugs", c: "--sev-critical", of: T.bugs || 0,
        ofl: "of all bugs",
        sub: sev.critical ? "data loss, security, or a dead primary flow" : "none found" },
      { v: sev.high || 0, l: "High bugs", c: "--sev-high", of: T.bugs || 0, ofl: "of all bugs",
        sub: (sev.medium || 0) + " medium · " + (sev.low || 0) + " low" },
      { v: broken, l: "Flows that don't complete", c: "--sev-medium", of: flows,
        ofl: "of all flows", sub: "broken or never implemented" },
      { v: noTests.length, l: "Features without tests", c: noTests.length ? "--sev-high" : "--st-good",
        of: nFeat, ofl: "of all features",
        sub: noTests.length ? noTests.slice(0, 3).join(", ") +
          (noTests.length > 3 ? " +" + (noTests.length - 3) + " more" : "")
          : "every feature has tests" },
      { v: lowConf.length, l: "Low-confidence reads", c: "--muted", of: nFeat,
        ofl: "of all features",
        sub: lowConf.length ? "inferred from partial reading" : "all features read directly" }
    ];
    return section("findings", "Headline numbers",
      (T.bugs || 0) + " bugs · " + (T.gaps || 0) + " gaps · " +
      (T.opportunities || 0) + " opportunities",
      '<div class="tiles">' +
      items.map(function (i, n) {
        var p = pct(i.v, i.of);
        return '<div class="tile" style="--tc:var(' + i.c + ');animation-delay:' + (n * 55) + 'ms">' +
          '<div class="v num">' + i.v + "</div>" +
          '<div class="l"><i class="dot" style="background:var(' + i.c + ')"></i>' + i.l + "</div>" +
          '<div class="sub">' + esc(i.sub) + "</div>" +
          (i.of ? '<div class="meter"' + tip(Math.round(p) + "% " + i.ofl +
            " (" + i.v + " of " + i.of + ")") + '><i style="width:' +
            (i.v ? Math.max(1.5, p).toFixed(1) : 0) + '%"></i></div>' : "") +
          "</div>";
      }).join("") + "</div>", "Findings");
  }

  /* ---------- verdict ---------- */
  function verdict() {
    if (!P.summary) return "";
    return section("verdict", "The verdict", "",
      '<div class="card"><div class="verdict">' +
      esc(P.summary).split(/\n\s*\n/).map(function (p) { return "<p>" + p + "</p>"; }).join("") +
      "</div></div>");
  }

  /* ---------- risk map ----------
     Maturity across, severity weight up, area = findings. Two encodings that already exist in the
     report, crossed — which is the whole point: the feature sitting top-left is immature AND
     dangerous, and no single bar chart puts those two facts in the same place. */
  function riskMap() {
    var pts = FEATURES.map(function (f) {
      var c = f.counts || {}, bs = c.bugs_by_severity || {};
      return { f: f, name: f.name || f.slug, slug: f.slug,
               mi: Math.max(0, MATURITY.indexOf(f.maturity)),
               w: severityWeight(bs), bugs: c.bugs || 0,
               all: (c.bugs || 0) + (c.gaps || 0) + (c.opportunities || 0), bs: bs };
    });
    if (!pts.some(function (p) { return p.w; })) return "";

    var W = 900, H = 396, ML = 84, MR = 26, MT = 26, MB = 60;
    var iw = W - ML - MR, ih = H - MT - MB;
    /* sqrt on the weight: one critical bug is 1000 and would otherwise flatten everything else
       onto the floor. The gridlines below anchor that scale to something nameable. */
    var maxW = Math.max.apply(null, pts.map(function (p) { return p.w; }).concat([1]));
    var maxY = Math.sqrt(maxW);
    var maxR = Math.max.apply(null, pts.map(function (p) { return p.all; }).concat([1]));
    var band = iw / MATURITY.length;
    var RMAX = 22;
    /* Reserve a bubble's worth of headroom, or the tallest one is drawn half outside the plot. */
    var top = MT + RMAX + 8, plot = MT + ih - top;
    var y = function (w) { return MT + ih - (Math.sqrt(w) / maxY) * plot; };
    var r = function (n) { return Math.max(5, Math.sqrt(n / maxR) * RMAX); };

    /* Features sharing a maturity would otherwise stack on one vertical line and overlap. Spread
       them evenly across their band instead — deterministic, so the chart is stable between
       builds, and the band is still what the x position means. */
    var lanes = {};
    pts.forEach(function (p) { (lanes[p.mi] || (lanes[p.mi] = [])).push(p); });
    Object.keys(lanes).forEach(function (mi) {
      var group = lanes[mi].sort(function (a, b) { return b.w - a.w || (a.slug < b.slug ? -1 : 1); });
      group.forEach(function (p, k) {
        p.cx = ML + band * (+mi + (group.length === 1 ? 0.5 : 0.12 + 0.76 * (k / (group.length - 1))));
        p.cy = y(p.w);
        p.r = r(p.all);
      });
    });

    /* One bug of each severity, as a height. An abstract weight axis needs something nameable on
       it or the reader has no idea what "high" looks like. */
    /* Ticks run top-down, so y grows as the weight falls. The sqrt scale crowds the low end; a
       tick whose label would land on the previous one is dropped rather than overprinted. */
    var lastTick = -Infinity;
    var ticks = [[1000, "1 critical"], [100, "1 high"], [10, "1 medium"], [1, "1 low"]]
      .filter(function (t) {
        if (t[0] > maxW || y(t[0]) - lastTick < 15) return false;
        lastTick = y(t[0]);
        return true;
      })
      .map(function (t) {
        return '<line class="axis" x1="' + ML + '" y1="' + y(t[0]).toFixed(1) + '" x2="' +
          (ML + iw) + '" y2="' + y(t[0]).toFixed(1) + '" stroke-dasharray="2 4"></line>' +
          '<text class="axis-lab" text-anchor="end" x="' + (ML - 8) + '" y="' +
          (y(t[0]) + 4).toFixed(1) + '">' + t[1] + "</text>";
      }).join("");

    /* Greedy label placement: worst first, and anything whose box would land on an already-placed
       one is left to its tooltip. A thicket of overlapping names is worse than fewer names. */
    var placed = [];
    var labelFor = function (p) {
      var w = p.name.length * 6.2, lx = p.cx, ly = p.cy - p.r - 7;
      if (ly < 12) ly = p.cy + p.r + 14;                   /* would clip the top: drop it below */
      var box = { x1: lx - w / 2, x2: lx + w / 2, y1: ly - 11, y2: ly + 4 };
      var hit = placed.some(function (b) {
        return box.x1 < b.x2 && box.x2 > b.x1 && box.y1 < b.y2 && box.y2 > b.y1;
      });
      if (hit) return "";
      placed.push(box);
      return '<text class="bub-lab" text-anchor="middle" x="' + lx.toFixed(1) + '" y="' +
        ly.toFixed(1) + '">' + esc(p.name) + "</text>";
    };
    var labels = pts.filter(function (p) { return p.all; })
                    .sort(function (a, b) { return b.w - a.w; })
                    .slice(0, 7).map(labelFor).join("");

    var betaAt = MATURITY.indexOf("beta");
    var svg = '<svg class="riskmap" viewBox="0 0 ' + W + " " + H +
      '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' +
      "Features plotted by maturity and severity weight; the sortable data table under Features " +
      "carries the same numbers" + '">' +
      '<rect class="quad" x="' + ML + '" y="' + MT + '" width="' + (band * betaAt).toFixed(1) +
        '" height="' + ih + '" rx="8"></rect>' +
      /* Under the axis: the only place a bubble or a gridline can never land on it. */
      '<text class="quad-lab" text-anchor="middle" x="' + (ML + band * betaAt / 2).toFixed(1) +
        '" y="' + (MT + ih + 42) + '">Below beta — immature and dangerous</text>' +
      ticks +
      '<line class="axis" x1="' + ML + '" y1="' + (MT + ih) + '" x2="' + (ML + iw) +
        '" y2="' + (MT + ih) + '"></line>' +
      '<line class="axis" x1="' + ML + '" y1="' + MT + '" x2="' + ML + '" y2="' + (MT + ih) +
        '"></line>' +
      MATURITY.map(function (m, i) {
        return '<text class="axis-lab" text-anchor="middle" x="' +
          (ML + band * (i + 0.5)).toFixed(1) + '" y="' + (MT + ih + 22) + '">' +
          esc(MAT_LABEL[m]) + "</text>";
      }).join("") +
      pts.filter(function (p) { return p.all; })
         .sort(function (a, b) { return b.all - a.all; })   /* big behind, small in front */
         .map(function (p, i) {
        return '<circle class="bub" cx="' + p.cx.toFixed(1) + '" cy="' + p.cy.toFixed(1) +
          '" r="' + p.r.toFixed(1) + '" data-goto="' + esc(p.slug) +
          '" style="animation-delay:' + (i * 35) + 'ms"' +
          tip(p.name + " — " + (MAT_LABEL[p.f.maturity] || p.f.maturity) + " · " +
              plural(p.bugs, "bug") +
              (p.bugs ? " (" + SEVERITY.filter(function (s) { return p.bs[s]; })
                .map(function (s) { return p.bs[s] + " " + s; }).join(", ") + ")" : "") +
              " · " + plural(p.all, "finding") + " in total") + "></circle>";
      }).join("") + labels +
      "</svg>";

    return section("risk", "Risk map", "maturity × severity · area is total findings",
      '<div class="card">' + svg +
      '<div class="axis-note">Each bubble is a feature. Left to right is maturity, the same order ' +
      "as the maturity mix. Up is severity weight — critical×1000, high×100, medium×10, low×1, " +
      "the same ranking Bugs by feature sorts on — plotted on a square-root scale so one critical " +
      "bug does not flatten everything else onto the floor, with the dashed lines marking where a " +
      "feature carrying exactly one bug of that severity would sit. Area is total findings, and " +
      "features sharing a maturity are spread across their band rather than stacked on one line. " +
      "The shaded band is everything below beta: a bubble high and to the left is a feature that " +
      "is both unfinished and already dangerous. Click one to open its full read.</div></div>",
      "Risk");
  }

  /* ---------- user-flow health ---------- */
  function flowHealth() {
    var withFlows = FEATURES.filter(function (f) { return list(f.user_flows).length; });
    if (!withFlows.length) return "";
    var STATUS = ["working", "partial", "broken", "not_implemented"];

    var tally = function (fs) {
      var t = { working: 0, partial: 0, broken: 0, not_implemented: 0, total: 0 };
      fs.forEach(function (fl) {
        var s = STATUS.indexOf(fl.status) >= 0 ? fl.status : "not_implemented";
        t[s]++; t.total++;
      });
      return t;
    };
    var all = tally(withFlows.reduce(function (a, f) { return a.concat(list(f.user_flows)); }, []));

    var band = function (t, delay, name) {
      return STATUS.map(function (s, i) {
        var n = t[s], p = pct(n, t.total);
        return '<div class="seg f-' + s + (n ? "" : " z") + '" style="width:' + p.toFixed(3) +
          "%;animation-delay:" + (delay + i * 40) + 'ms"' +
          tip((name ? name + " — " : "") + FLOW_LABEL[s] + ": " + plural(n, "flow") +
              " (" + Math.round(p) + "%)") + ">" + (p >= 9 ? n : "") + "</div>";
      }).join("");
    };

    var max = Math.max.apply(null, withFlows.map(function (f) {
      return list(f.user_flows).length;
    }).concat([1]));
    var rows = withFlows.map(function (f, i) {
      var t = tally(list(f.user_flows));
      return '<a class="row" href="#' + esc(f.slug) + '"><div class="rlabel">' +
        esc(f.name || f.slug) + '</div><div class="track"><div class="stack" style="width:' +
        pct(t.total, max).toFixed(3) + '%">' + band(t, i * 20, f.name || f.slug) +
        "</div></div>" + '<div class="rval">' + t.total + "</div></a>";
    }).join("");

    var legend = STATUS.map(function (s) {
      return '<span class="key' + (all[s] ? "" : " off") +
        '"><i class="sw" style="background:var(' +
        ({ working: "--st-good", partial: "--st-warning", broken: "--st-critical",
           not_implemented: "--muted" })[s] + ')"></i>' + FLOW_LABEL[s] +
        ' <span class="num">' + all[s] + "</span></span>";
    }).join("");

    var bad = all.broken + all.not_implemented;
    return section("flows", "User-flow health",
      plural(all.total, "flow") + " across " + plural(withFlows.length, "feature"),
      '<div class="card band"><div class="stack">' + band(all, 0) + "</div>" +
      '<div class="legend">' + legend + "</div>" +
      '<div class="rows" style="margin-top:20px">' + rows + "</div>" +
      '<div class="axis-note">A flow is one thing a user is trying to get done. ' +
      (bad
        ? "<b>" + plural(bad, "flow") + "</b> do not complete — " + all.broken +
          " break partway and " + all.not_implemented + " were never built. "
        : "Every flow completes. ") +
      "Row length is the number of flows the feature declares, so a short row means little was " +
      "mapped there rather than little is wrong. Click a row to open that feature.</div></div>");
  }

  /* ---------- bug types ---------- */
  function bugTypes() {
    var bugs = [];
    FEATURES.forEach(function (f) { list(f.bugs).forEach(function (b) { bugs.push(b); }); });
    if (!bugs.length) return "";

    var by = {};
    bugs.forEach(function (b) {
      var t = BUG_TYPE.indexOf(b.type) >= 0 ? b.type : "other";
      var e = by[t] || (by[t] = { total: 0, sev: {} });
      e.total++;
      var s = SEVERITY.indexOf(b.severity) >= 0 ? b.severity : "medium";
      e.sev[s] = (e.sev[s] || 0) + 1;
    });
    /* "other" always sorts last — it is a leftover bucket, not a finding type that beat the rest. */
    var keys = Object.keys(by).sort(function (a, b) {
      if (a === "other") return 1;
      if (b === "other") return -1;
      return by[b].total - by[a].total;
    });
    var max = Math.max.apply(null, keys.map(function (k) { return by[k].total; }).concat([1]));

    var rows = keys.map(function (k, i) {
      var e = by[k];
      var segs = SEVERITY.map(function (s) {
        var n = e.sev[s] || 0;
        if (!n) return "";
        return '<div class="seg" style="width:' + pct(n, e.total).toFixed(3) +
          "%;background:var(--sev-" + s + ");animation-delay:" + (i * 30) + 'ms"' +
          tip((TYPE_LABEL[k] || "Other") + " — " + plural(n, SEV_LABEL[s].toLowerCase() + " bug")) +
          "></div>";
      }).join("");
      return '<div class="row"><div class="rlabel">' + esc(TYPE_LABEL[k] || "Other") +
        '</div><div class="track"><div class="stack" style="width:' +
        pct(e.total, max).toFixed(3) + '%">' + segs + "</div></div>" +
        '<div class="rval">' + e.total + "</div></div>";
    }).join("");

    var legend = SEVERITY.map(function (s) {
      return '<span class="key"><i class="sw" style="background:var(--sev-' + s + ')"></i>' +
        SEV_LABEL[s] + "</span>";
    }).join("");

    var top = TYPE_LABEL[keys[0]] || "Other";
    return section("types", "What kind of broken", "bug type × severity",
      '<div class="card"><div class="rows">' + rows + "</div>" +
      '<div class="legend">' + legend + "</div>" +
      '<div class="axis-note">The same ' + bugs.length + " bugs as the chart above, cut by what " +
      "sort of defect they are rather than where they live. <b>" + esc(top) + "</b> leads with " +
      by[keys[0]].total + ". A tall single category usually points at one habit repeated across " +
      "the codebase — check Cross-cutting before filing them one at a time.</div></div>");
  }

  /* ---------- bugs by feature ---------- */
  function severityChart() {
    var rows = FEATURES.map(function (f) {
      var c = f.counts || {}, bs = c.bugs_by_severity || {};
      return { name: f.name || f.slug, slug: f.slug, total: c.bugs || 0, bs: bs,
               weight: (bs.critical || 0) * 1000 + (bs.high || 0) * 100 +
                       (bs.medium || 0) * 10 + (bs.low || 0) };
    }).sort(function (a, b) { return b.weight - a.weight || b.total - a.total; });
    var max = Math.max.apply(null, rows.map(function (r) { return r.total; }).concat([1]));

    var body = rows.map(function (r, i) {
      var segs = SEVERITY.map(function (s) {
        var n = r.bs[s] || 0;
        if (!n) return "";
        return '<div class="seg" style="width:' + pct(n, r.total).toFixed(3) +
          "%;background:var(--sev-" + s + ");animation-delay:" + (i * 22) + 'ms"' +
          tip(r.name + " — " + plural(n, SEV_LABEL[s].toLowerCase() + " bug")) + "></div>";
      }).join("");
      return '<a class="row" href="#' + esc(r.slug) + '"><div class="rlabel">' + esc(r.name) +
        '</div><div class="track"><div class="stack" style="width:' +
          pct(r.total, max).toFixed(3) + '%">' + segs + "</div></div>" +
        '<div class="rval">' + (r.total || "—") + "</div></a>";
    }).join("");

    var legend = SEVERITY.map(function (s) {
      return '<span class="key"><i class="sw" style="background:var(--sev-' + s + ')"></i>' +
        SEV_LABEL[s] + ' <span class="num">' + ((T.bugs_by_severity || {})[s] || 0) +
        "</span></span>";
    }).join("");

    return section("bugs", "Bugs by feature", "ordered by severity weight",
      '<div class="card"><div class="rows">' + body + "</div>" +
      '<div class="legend">' + legend + "</div>" +
      '<div class="axis-note">Bar length is the bug count (longest ' + max +
      "). Order is by severity weight rather than count, so a feature with fewer but more severe " +
      "bugs ranks higher. Gaps and opportunities are counted separately — see Planning.</div></div>");
  }

  /* ---------- planning grids ---------- */
  function heatGrid(colKeys, colLabels, rowKeys, rowLabels, cell, caption) {
    var max = 0;
    rowKeys.forEach(function (r) {
      colKeys.forEach(function (c) { max = Math.max(max, cell(r, c).length); });
    });
    var html = '<div class="heat" style="grid-template-columns:64px repeat(' + colKeys.length +
      ',1fr)"><div></div>' +
      colKeys.map(function (c) { return '<div class="hlab">' + colLabels[c] + "</div>"; }).join("");
    rowKeys.forEach(function (r) {
      html += '<div class="hlab row-lab">' + rowLabels[r] + "</div>";
      colKeys.forEach(function (c) {
        var items = cell(r, c);
        html += '<div class="hc ' + densityClass(items.length, max) + '"' +
          tip(rowLabels[r] + " × " + colLabels[c] + " — " + plural(items.length, "finding") +
              (items.length ? ": " + items.slice(0, 3).join("; ") +
                (items.length > 3 ? " …" : "") : "")) +
          ">" + (items.length || "") + "</div>";
      });
    });
    html += "</div>";
    return html + (caption ? '<div class="axis-note">' + caption + "</div>" : "");
  }

  function planning() {
    var bugs = [], plan = [];
    FEATURES.forEach(function (f) {
      list(f.bugs).forEach(function (b) { bugs.push({ f: f, x: b, sev: b.severity, eff: b.effort }); });
      list(f.gaps).forEach(function (g) { plan.push({ f: f, x: g, pri: g.priority, eff: g.effort }); });
      list(f.opportunities).forEach(function (o) {
        plan.push({ f: f, x: o, pri: o.priority, eff: o.effort });
      });
    });

    var effLabels = { S: "S", M: "M", L: "L" };
    var sevLabels = {}, priLabels = {};
    SEVERITY.forEach(function (s) { sevLabels[s] = SEV_LABEL[s]; });
    PRIORITY.forEach(function (p) { priLabels[p] = p; });

    var left = heatGrid(EFFORT, effLabels, SEVERITY, sevLabels, function (sev, eff) {
      return bugs.filter(function (b) { return b.sev === sev && b.eff === eff; })
                 .map(function (b) { return b.x.title; });
    }, "Bugs by severity and effort. The top-left cell is where to start: severe and cheap. " +
       "S &lt;1d · M 1-3d · L &gt;3d.");

    var right = heatGrid(EFFORT, effLabels, PRIORITY, priLabels, function (pri, eff) {
      return plan.filter(function (p) { return p.pri === pri && p.eff === eff; })
                 .map(function (p) { return p.x.title; });
    }, "Gaps and opportunities by priority and effort. Bugs are ranked by severity instead, " +
       "so they are in the grid on the left.");

    return section("planning", "Planning", "count per cell · darker means more work pooled there",
      '<div class="grid2"><div class="card"><h3 style="font-size:14px;margin-bottom:14px">' +
      "Bugs · severity × effort</h3>" + left + "</div>" +
      '<div class="card"><h3 style="font-size:14px;margin-bottom:14px">' +
      "Gaps &amp; opportunities · priority × effort</h3>" + right + "</div></div>", "Planning");
  }

  /* ---------- dependency matrix ---------- */
  function dependencies() {
    var slugs = FEATURES.map(function (f) { return f.slug; });
    var names = {};
    FEATURES.forEach(function (f) { names[f.slug] = f.name || f.slug; });
    var deps = {};
    var any = 0;
    FEATURES.forEach(function (f) {
      deps[f.slug] = {};
      list(f.dependencies).forEach(function (d) {
        if (slugs.indexOf(d) >= 0) { deps[f.slug][d] = 1; any++; }
      });
    });
    if (!any || slugs.length > 26) return "";

    var head = '<tr><th></th>' + slugs.map(function (s) {
      return '<th class="col"><span>' + esc(names[s]) + "</span></th>";
    }).join("") + "</tr>";

    var body = slugs.map(function (r) {
      return '<tr><th class="rowh">' + esc(names[r]) + "</th>" + slugs.map(function (c) {
        if (r === c) return '<td><i class="self"></i></td>';
        var on = deps[r][c];
        return "<td>" + (on
          ? '<i class="on"' + tip(names[r] + " depends on " + names[c]) + "></i>"
          : '<i></i>') + "</td>";
      }).join("") + "</tr>";
    }).join("");

    var leaders = slugs.map(function (s) {
      return { s: s, n: slugs.filter(function (r) { return deps[r][s]; }).length };
    }).sort(function (a, b) { return b.n - a.n; }).filter(function (x) { return x.n; }).slice(0, 3);

    return section("deps", "Dependency map",
      "row depends on column · " + plural(any, "edge"),
      '<div class="card"><div class="dep"><table>' + head + body + "</table></div>" +
      '<div class="axis-note">' + (leaders.length
        ? "Most depended-on: " + leaders.map(function (l) {
            return "<b>" + esc(names[l.s]) + "</b> (" + l.n + ")";
          }).join(", ") + ". Breaking these breaks the most surface area."
        : "No feature is depended on by another.") + "</div></div>");
  }

  /* ---------- cross-cutting ---------- */
  function crossCutting() {
    var xs = list(P.cross_cutting);
    if (!xs.length) return "";
    return section("xc", "Cross-cutting", "one root cause, many features",
      xs.map(function (x) {
        var sev = SEVERITY.indexOf(x.severity) >= 0 ? x.severity : "medium";
        return '<div class="card xc"><div class="xhead">' +
          '<span class="chip"><i class="sw" style="background:var(--sev-' + sev + ')"></i>' +
            esc(SEV_LABEL[sev]) + "</span>" +
          '<span class="pill">' + esc(KIND_LABEL[x.type] || x.type || "finding") + "</span>" +
          '<span class="xtitle">' + esc(x.title) + "</span>" +
          '<span class="fid mono faint" style="margin-left:auto">' + esc(x.id || "") + "</span></div>" +
          (x.suggested_fix ? '<div class="fbody small dim" style="margin-top:9px">' +
            esc(x.suggested_fix) + "</div>" : "") +
          '<div class="chips">' + list(x.affects).map(function (a) {
            return '<a class="chip plain" href="#' + esc(a) + '">' + esc(a) + "</a>";
          }).join("") + "</div>" +
          '<div class="ev" style="margin-top:10px">' + paths(x.evidence) + "</div></div>";
      }).join(""));
  }

  /* ---------- top findings + sequence ---------- */
  function priorities() {
    var tops = list(P.top_findings), seq = list(P.recommended_sequence);
    if (!tops.length && !seq.length) return "";
    var left = tops.length
